<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halloween | RhythmosAE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{position:relative;background:#08030b;color:#ffdca8;font-family:Georgia,'Times New Roman',serif;touch-action:manipulation}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(124,28,83,.38),transparent 34%),radial-gradient(circle at 15% 80%,rgba(255,93,35,.12),transparent 30%),linear-gradient(#050207,#120512 52%,#030105);animation:nightPulse 5s ease-in-out infinite alternate}
#scene{position:absolute;inset:0;overflow:hidden}
.moon{position:absolute;width:min(23vw,190px);height:min(23vw,190px);min-width:115px;min-height:115px;right:12%;top:9%;border-radius:50%;background:#ffdca0;box-shadow:0 0 22px rgba(255,193,91,.8),0 0 90px rgba(245,92,36,.25);animation:moonFloat 6s ease-in-out infinite alternate}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(110,50,32,.16)}
.moon::before{width:22%;height:22%;left:22%;top:24%}.moon::after{width:15%;height:15%;right:23%;bottom:22%}
.cloud{position:absolute;height:55px;width:320px;border-radius:50%;background:rgba(38,8,43,.62);filter:blur(12px);animation:cloudDrift 14s linear infinite}
.c1{top:20%;left:-120px}.c2{top:36%;right:-150px;animation-delay:-7s}
.fog{position:absolute;left:-10%;right:-10%;height:110px;border-radius:50%;background:rgba(125,33,100,.12);filter:blur(25px);animation:fogMove 7s ease-in-out infinite alternate}
.f1{bottom:17%}.f2{bottom:28%;animation-delay:-3s;opacity:.65}
#pumpkins{position:absolute;left:0;right:0;bottom:8%;height:150px;display:flex;justify-content:center;gap:clamp(12px,4vw,55px);align-items:flex-end}
.pumpkin{position:relative;width:clamp(58px,9vw,100px);height:clamp(48px,7vw,82px);border-radius:48% 52% 46% 54%;background:#c65325;box-shadow:inset 8px 0 rgba(255,140,47,.18),0 0 20px rgba(255,75,18,.18);animation:pumpkinBob 3s ease-in-out infinite alternate}
.pumpkin::before{content:"";position:absolute;left:47%;top:-14px;width:10px;height:18px;border-radius:5px;background:#392313;transform:rotate(5deg)}
.eye,.mouth{position:absolute;background:#17030b;filter:drop-shadow(0 0 4px #ff7b25)}
.eye{top:28%;width:18px;height:13px;clip-path:polygon(0 100%,50% 0,100% 100%)}.eye.l{left:20%}.eye.r{right:20%}
.mouth{left:22%;right:22%;bottom:18%;height:15px;clip-path:polygon(0 0,18% 35%,32% 0,50% 35%,68% 0,82% 35%,100% 0,88% 100%,12% 100%)}
.pumpkin:nth-child(2){animation-delay:-.8s;transform:scale(.78)}.pumpkin:nth-child(3){animation-delay:-1.5s;transform:scale(.9)}
#title{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:100%;text-align:center;z-index:5;animation:titleAppear 2.4s ease-out both}
#title h1{font-size:clamp(44px,9vw,92px);letter-spacing:8px;color:#ffb65c;text-shadow:0 0 8px #ff7b25,0 0 28px rgba(214,43,85,.8),0 0 70px rgba(125,24,102,.55);animation:titleFlicker 3.4s 1.2s infinite}
#title p{margin-top:8px;font-size:clamp(15px,2.5vw,24px);letter-spacing:5px;color:#d89bb9;opacity:.8}
#start{position:absolute;left:50%;top:65%;transform:translate(-50%,-50%);z-index:10;opacity:0;pointer-events:none;font-family:Georgia,'Times New Roman',serif;font-size:clamp(22px,5vw,44px);letter-spacing:6px;color:#ffe8c0;text-shadow:0 0 10px #ff9b38,0 0 26px rgba(255,64,91,.8);background:none;border:0;cursor:pointer;animation:startPulse 1.6s ease-in-out infinite alternate}
#start.show{opacity:1;pointer-events:auto}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:100;transition:opacity 1.15s ease}
#fade.active{opacity:1}
#bat{position:absolute;top:13%;left:-90px;font-size:54px;color:#160516;filter:drop-shadow(0 0 8px rgba(0,0,0,.8));animation:batFly 9s 1s linear infinite;z-index:4}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#ff8c38;box-shadow:0 0 9px #ff5c22;animation:particleFloat 4s linear infinite}
@keyframes nightPulse{from{opacity:.75}to{opacity:1}}@keyframes moonFloat{from{transform:translateY(0)}to{transform:translateY(-14px)}}@keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(110vw)}}@keyframes fogMove{from{transform:translateX(-5%)}to{transform:translateX(8%)}}@keyframes pumpkinBob{from{transform:translateY(0)}to{transform:translateY(-8px)}}@keyframes titleAppear{0%{opacity:0;transform:translate(-50%,-42%) scale(.92)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes titleFlicker{0%,18%,20%,22%,62%,64%,100%{opacity:1}19%,21%,63%{opacity:.55}}@keyframes startPulse{from{transform:translate(-50%,-50%) scale(1);opacity:.65}to{transform:translate(-50%,-50%) scale(1.08);opacity:1}}@keyframes batFly{0%{left:-90px;transform:translateY(0) rotate(-8deg)}45%{left:52vw;transform:translateY(-80px) rotate(5deg)}100%{left:110vw;transform:translateY(20px) rotate(-5deg)}}@keyframes particleFloat{from{transform:translateY(20vh);opacity:0}20%{opacity:.8}to{transform:translateY(-40vh);opacity:0}}
@media(max-width:600px){.moon{right:7%;top:7%}#title{top:40%}#start{top:64%}#pumpkins{bottom:7%}}
</style>
</head>
<body>
<div id="scene">
  <div class="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="fog f1"></div><div class="fog f2"></div><div id="bat">🦇</div>
  <div id="pumpkins"><div class="pumpkin"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div><div class="pumpkin"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div><div class="pumpkin"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div></div>
  <div id="title"><h1>HALLOWEEN NIGHT</h1><p>RhythmosAE</p></div>
  <button id="start" aria-label="Touch The Start">Touch The Start</button>
  <div id="fade"></div>
</div>
<script>
const start=document.getElementById('start');
const fade=document.getElementById('fade');
const particles=[];
for(let i=0;i<24;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.left=Math.random()*100+'vw';
  p.style.top=(45+Math.random()*55)+'vh';
  p.style.animationDelay=(-Math.random()*4)+'s';
  p.style.animationDuration=(3+Math.random()*4)+'s';
  document.getElementById('scene').appendChild(p);
  particles.push(p);
}
setTimeout(()=>start.classList.add('show'),3200);
function enterGame(){
  if(fade.classList.contains('active'))return;
  fade.classList.add('active');
  setTimeout(()=>{location.href='hwgame.html';},1150);
}
start.addEventListener('click',enterGame);
start.addEventListener('touchend',e=>{e.preventDefault();enterGame();},{passive:false});
</script>
</body>
</html>
