<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halloween | RhythmosAE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#090612;color:#fff;font-family:monospace;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
#screen{position:relative;width:min(100vw,calc(100vh * 4 / 3));height:min(100vh,calc(100vw * 3 / 4));aspect-ratio:4/3;background:#15102b;overflow:hidden;image-rendering:pixelated;image-rendering:crisp-edges}
#screen:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);z-index:50;pointer-events:none;mix-blend-mode:multiply}
#sky{position:absolute;inset:0;background:linear-gradient(#100b29 0 55%,#21123a 55% 72%,#080711 72%)}
#stars{position:absolute;inset:0}
.star{position:absolute;width:3px;height:3px;background:#f8e8b0;box-shadow:0 0 0 1px #f8e8b0}
.star.b{width:2px;height:2px;background:#8f8bd1;box-shadow:none}
#moon{position:absolute;right:13%;top:11%;width:58px;height:58px;border-radius:50%;background:#ffd98a;box-shadow:8px 8px 0 #21132e}
.crater{position:absolute;background:#d5ad70;border-radius:50%}
.c1{width:12px;height:8px;left:11px;top:16px}.c2{width:8px;height:8px;right:12px;top:9px}.c3{width:10px;height:6px;right:10px;bottom:13px}
#cloud1,#cloud2{position:absolute;height:10px;background:#30204b;box-shadow:10px -7px #30204b,22px -4px #30204b,34px 0 #30204b}
#cloud1{width:44px;left:8%;top:23%;animation:cloud 9s linear infinite}
#cloud2{width:50px;right:7%;top:35%;animation:cloud2 12s linear infinite}
#mountains{position:absolute;left:0;right:0;bottom:25%;height:55px;background:#100b20;clip-path:polygon(0 100%,0 55%,10% 30%,18% 67%,30% 18%,41% 66%,53% 25%,64% 70%,76% 34%,88% 63%,100% 23%,100% 100%)}
#ground{position:absolute;left:0;right:0;bottom:0;height:27%;background:#07050c;border-top:4px solid #3b2148}
.pumpkin{position:absolute;bottom:9%;width:28px;height:24px;background:#c45b28;border-radius:8px;box-shadow:6px 0 #c45b28,-6px 0 #c45b28,0 -4px #c45b28}
.pumpkin:before{content:"";position:absolute;left:10px;top:-6px;width:7px;height:6px;background:#57371f}
.pumpkin:after{content:"";position:absolute;left:6px;top:9px;width:5px;height:5px;background:#190913;box-shadow:12px 0 #190913,6px 7px #190913}
.p1{left:14%}.p2{left:23%;transform:scale(.72)}.p3{right:22%;transform:scale(.8)}.p4{right:11%;transform:scale(.62)}
#title{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:100%;text-align:center;z-index:10}
#title h1{font-family:monospace;font-size:clamp(24px,7vw,50px);font-weight:900;letter-spacing:3px;color:#ffb84d;text-shadow:3px 3px 0 #7b263e,6px 6px 0 #210e28;white-space:nowrap}
#title p{margin-top:8px;font-size:clamp(9px,2vw,14px);letter-spacing:3px;color:#e6b2d2;text-shadow:2px 2px #25112d}
#press{position:absolute;left:50%;top:69%;transform:translate(-50%,-50%);z-index:12;border:0;background:#1b1130;color:#ffe9a8;font:900 clamp(11px,2.5vw,17px) monospace;letter-spacing:2px;padding:8px 14px;box-shadow:4px 4px 0 #05030a;cursor:pointer;opacity:0;pointer-events:none}
#press.show{opacity:1;pointer-events:auto;animation:blink .9s steps(2,end) infinite}
#hud{position:absolute;left:8px;top:7px;z-index:11;color:#8579b7;font-size:8px;letter-spacing:1px}
#bat{position:absolute;left:-36px;top:16%;z-index:8;width:32px;height:16px;image-rendering:pixelated;transform-origin:center;animation:bat 8s linear infinite}
#bat .pixel{position:absolute;width:4px;height:4px;background:#05030a}
#bat .b1{left:12px;top:4px;width:8px;height:8px}
#bat .b2{left:8px;top:0;width:4px;height:8px}
#bat .b3{left:20px;top:0;width:4px;height:8px}
#bat .b4{left:4px;top:4px;width:4px;height:8px}
#bat .b5{left:24px;top:4px;width:4px;height:8px}
#bat .b6{left:0;top:8px;width:4px;height:4px}
#bat .b7{left:28px;top:8px;width:4px;height:4px}
#bat .b8{left:12px;top:12px;width:4px;height:4px}
#bat .b9{left:20px;top:12px;width:4px;height:4px}
#bat .eye{position:absolute;left:14px;top:7px;width:2px;height:2px;background:#d86b46}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:100;transition:opacity .8s steps(6,end)}
#fade.active{opacity:1}
#vignette{position:absolute;inset:0;z-index:49;box-shadow:inset 0 0 45px #000;pointer-events:none}
@keyframes blink{50%{opacity:.35}}
@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(110px)}}
@keyframes cloud2{from{transform:translateX(0)}to{transform:translateX(-130px)}}
@keyframes bat{
0%{left:-36px;top:18%;transform:scaleX(1) scaleY(1)}
12%{transform:scaleX(.88) scaleY(1.18)}
25%{transform:scaleX(1) scaleY(1)}
37%{transform:scaleX(.88) scaleY(1.18)}
50%{left:48%;top:10%;transform:scaleX(1) scaleY(1)}
62%{transform:scaleX(.88) scaleY(1.18)}
75%{transform:scaleX(1) scaleY(1)}
87%{transform:scaleX(.88) scaleY(1.18)}
100%{left:105%;top:25%;transform:scaleX(1) scaleY(1)}
}
@media(max-width:600px){#title h1{letter-spacing:1px}}
</style>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<audio id="hw-bgm" src="Peritune_BattleField5_Retro.mp3" loop preload="auto"></audio>
<div id="screen">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="moon"><i class="crater c1"></i><i class="crater c2"></i><i class="crater c3"></i></div>
  <div id="cloud1"></div><div id="cloud2"></div>
  <div id="bat">
    <i class="pixel b1"></i><i class="pixel b2"></i><i class="pixel b3"></i>
    <i class="pixel b4"></i><i class="pixel b5"></i><i class="pixel b6"></i>
    <i class="pixel b7"></i><i class="pixel b8"></i><i class="pixel b9"></i>
    <i class="eye"></i>
  </div>
  <div id="mountains"></div>
  <div id="ground"></div>
  <div class="pumpkin p1"></div><div class="pumpkin p2"></div><div class="pumpkin p3"></div><div class="pumpkin p4"></div>
  <div id="hud">RHYTHMOSAE // HALLOWEEN 199X</div>
  <div id="title"><h1>HALLOWEEN NIGHT</h1><p>RHYTHMOSAE SPECIAL EDITION</p></div>
  <button id="press" aria-label="Touch The Start">TOUCH THE START</button>
  <div id="vignette"></div>
  <div id="fade"></div>
</div>
<script>
const start=document.getElementById('press');
const fade=document.getElementById('fade');
const hwBgm=document.getElementById('hw-bgm');
hwBgm.volume=0.5;
function startHalloweenBgm(){hwBgm.play().catch(()=>{});}
startHalloweenBgm();
document.addEventListener('pointerdown',startHalloweenBgm,{once:true});
document.addEventListener('keydown',startHalloweenBgm,{once:true});

const stars=document.getElementById('stars');
for(let i=0;i<42;i++){
  const s=document.createElement('i');
  s.className='star'+(i%3===0?' b':'');
  s.style.left=(Math.random()*100)+'%';
  s.style.top=(Math.random()*58)+'%';
  stars.appendChild(s);
}

setTimeout(()=>start.classList.add('show'),2600);

function enterGame(){
  if(fade.classList.contains('active'))return;
  hwBgm.pause();
  fade.classList.add('active');
  setTimeout(()=>{location.href='hwgame.html';},850);
}
start.addEventListener('click',enterGame);
start.addEventListener('touchend',e=>{e.preventDefault();enterGame();},{passive:false});
</script>
</body>
</html>
