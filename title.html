<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>RhythmosAE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:100vw;height:100vh;overflow:hidden;color:white;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 20%,rgba(55,72,130,.45) 0%,transparent 38%),linear-gradient(to bottom,#02040d 0%,#070d24 45%,#111936 100%);}
body::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 8% 15%,rgba(255,255,255,.9) 0 1px,transparent 2px),radial-gradient(circle at 18% 72%,rgba(180,205,255,.8) 0 1px,transparent 2px),radial-gradient(circle at 31% 28%,rgba(255,255,255,.8) 0 1px,transparent 2px),radial-gradient(circle at 44% 82%,rgba(180,205,255,.75) 0 1px,transparent 2px),radial-gradient(circle at 58% 12%,rgba(255,255,255,.85) 0 1px,transparent 2px),radial-gradient(circle at 69% 63%,rgba(255,255,255,.7) 0 1px,transparent 2px),radial-gradient(circle at 79% 25%,rgba(180,205,255,.8) 0 1px,transparent 2px),radial-gradient(circle at 91% 78%,rgba(255,255,255,.8) 0 1px,transparent 2px);opacity:.85;}
.sun{position:absolute;width:150px;height:150px;border-radius:50%;background:#e8edff;box-shadow:0 0 25px rgba(190,210,255,.8),0 0 70px rgba(120,155,255,.35);top:13%;left:50%;transform:translateX(-50%);opacity:.95;animation:float 6s infinite alternate ease-in-out;}
.sun::before,.sun::after{content:"";position:absolute;border-radius:50%;background:rgba(125,140,180,.18);}
.sun::before{width:28px;height:28px;top:35px;left:38px;}.sun::after{width:18px;height:18px;top:82px;left:92px;}
.cloud{position:absolute;width:380px;height:70px;background:rgba(45,58,100,.28);border-radius:50%;filter:blur(18px);pointer-events:none;}.cloud1{top:28%;left:-70px;}.cloud2{top:48%;right:-100px;}.cloud3{top:70%;left:18%;}
.menu{position:relative;z-index:5;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;}
h1{font-family:'Great Vibes',cursive;font-size:100px;font-weight:400;letter-spacing:2px;color:#f3f6ff;text-shadow:0 0 10px rgba(220,230,255,.95),0 0 28px rgba(130,165,255,.7),0 0 55px rgba(90,130,255,.35);animation:titleFloat 5s ease-in-out infinite;}
.subtitle{margin-top:2px;font-family:'Great Vibes',cursive;font-size:34px;letter-spacing:3px;color:#e4bd62;text-shadow:0 0 7px rgba(255,215,120,.75),0 0 18px rgba(210,155,45,.45);animation:subtitleIn 1.4s .9s both;}
button{margin-top:30px;width:350px;padding:20px;font-size:30px;color:#eaf0ff;background:rgba(4,8,25,.38);border:2px solid rgba(190,205,255,.6);border-radius:15px;cursor:pointer;backdrop-filter:blur(9px);transition:.3s;}
button:hover{transform:scale(1.08);background:rgba(75,95,160,.22);box-shadow:0 0 30px rgba(150,180,255,.65);}
#guri{border-color:#8da8ff;}#guri:hover{box-shadow:0 0 30px #6f8fff;}#sym{border-color:#70d9ff;}#sym:hover{box-shadow:0 0 30px #4dcfff;}#credit{border-color:#b68cff;}#credit:hover{box-shadow:0 0 30px #9d6cff;}
.menu button:nth-of-type(1){animation:menuIn .9s 1.3s both;}.menu button:nth-of-type(2){animation:menuIn .9s 1.55s both;}.menu button:nth-of-type(3){animation:menuIn .9s 1.8s both;}
.shooting-star{position:fixed;width:150px;height:12px;pointer-events:none;z-index:2;transform-origin:calc(100% - 3px) 50%;animation:meteorMove .9s cubic-bezier(.18,.7,.3,1) forwards;}
.shooting-star-tail{position:absolute;right:5px;top:4px;width:145px;height:4px;border-radius:999px;background:linear-gradient(to left,rgba(255,255,255,.95),rgba(190,215,255,.7) 30%,rgba(140,180,255,.28) 65%,transparent);filter:blur(1px);transform-origin:right center;animation:meteorTail .9s ease-out forwards;}
.shooting-star-head{position:absolute;right:0;top:2px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff,0 0 14px #dbe8ff,0 0 28px rgba(150,190,255,.8);animation:meteorHead .9s ease-out forwards;}
@keyframes meteorMove{0%{opacity:0;transform:translate(0,0) rotate(var(--angle)) scale(.35);}8%{opacity:1;}18%{transform:translate(calc(var(--dx)*.12),calc(var(--dy)*.12)) rotate(var(--angle)) scale(1);}72%{opacity:1;transform:translate(calc(var(--dx)*.72),calc(var(--dy)*.72)) rotate(var(--angle)) scale(1.03);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--angle)) scale(.72);}}
@keyframes meteorTail{0%{opacity:0;transform:scaleX(.05);}12%{opacity:1;transform:scaleX(1);}60%{opacity:.78;transform:scaleX(.82);}100%{opacity:0;transform:scaleX(.18);}}
@keyframes meteorHead{0%{transform:scale(.35);opacity:0;}12%{transform:scale(1.1);opacity:1;}72%{transform:scale(1);opacity:1;}100%{transform:scale(.7);opacity:0;}}
@keyframes float{from{transform:translateX(-50%) translateY(0);}to{transform:translateX(-50%) translateY(-14px);}}
@keyframes titleFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes subtitleIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes menuIn{from{opacity:0;transform:translateY(24px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
#sound-notice{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.58);backdrop-filter:blur(4px);}
#sound-box{width:min(420px,85vw);padding:28px 26px 24px;text-align:center;background:rgba(8,13,35,.96);border:1px solid rgba(205,220,255,.7);border-radius:14px;box-shadow:0 0 35px rgba(100,140,255,.25);}
#sound-box p{font-size:18px;line-height:1.7;color:#eef3ff;}
#sound-complete{margin:22px auto 0;width:180px;padding:11px 18px;font-size:18px;color:#eef3ff;background:rgba(40,55,100,.75);border:1px solid rgba(205,220,255,.75);border-radius:8px;cursor:pointer;}
#sound-complete:hover{background:rgba(75,95,160,.85);box-shadow:0 0 20px rgba(150,180,255,.45);transform:scale(1.04);}
</style>
</head>
<body>
<audio id="title-bgm" src="title.mp3" loop preload="auto"></audio>
<div id="sound-notice">
    <div id="sound-box">
        <p>このゲームでは音が流れます。<br>再度、音量の設定を確認してください</p>
        <button id="sound-complete">完了</button>
    </div>
</div>
<div class="sun"></div>
<div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="cloud cloud3"></div>
<div class="menu"><h1>RhythmosAE</h1><div class="subtitle">Abyss and Eden</div><button id="guri" onclick="location.href='gfgame.html'">Abyss</button><button id="sym" onclick="location.href='spgame.html'">Eden</button><button id="credit" onclick="location.href='Credit.html'">Credits</button></div>
<script>
const titleBgm=document.getElementById('title-bgm');
const soundNotice=document.getElementById('sound-notice');
const soundComplete=document.getElementById('sound-complete');
soundComplete.addEventListener('click',()=>{soundNotice.remove();titleBgm.currentTime=0;titleBgm.play().catch(()=>{});});
function createShootingStar(){
    const star=document.createElement('div');
    const tail=document.createElement('div');
    const head=document.createElement('div');
    star.className='shooting-star';tail.className='shooting-star-tail';head.className='shooting-star-head';star.append(tail,head);
    const angle=18+Math.random()*30;
    const distance=300+Math.random()*320;
    const rad=angle*Math.PI/180;
    const dx=Math.cos(rad)*distance;
    const dy=Math.sin(rad)*distance;
    star.style.left=(Math.random()*78+7)+'vw';
    star.style.top=(Math.random()*42+6)+'vh';
    star.style.setProperty('--angle',angle+'deg');
    star.style.setProperty('--dx',dx+'px');
    star.style.setProperty('--dy',dy+'px');
    document.body.appendChild(star);
    star.addEventListener('animationend',()=>star.remove(),{once:true});
}
function scheduleShootingStar(){const delay=7000+Math.random()*13000;setTimeout(()=>{createShootingStar();scheduleShootingStar();},delay);}
scheduleShootingStar();
</script>
</body>
</html>
