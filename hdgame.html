<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Heaven's Door - Game</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b14;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center;min-height:100vh;overflow:hidden}.game{width:min(100vw,1100px);padding:20px;position:relative}.hud{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;font-weight:700}.lane-area{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:min(62vh,560px);min-height:320px}.lane{position:relative;border:1px solid #ffffff2a;background:linear-gradient(#ffffff08,#ffffff02);overflow:hidden}.key{position:absolute;left:8px;right:8px;bottom:10px;padding:10px;text-align:center;border:1px solid #ffffff40;background:#ffffff0d;font-weight:800}.status{margin-top:14px;text-align:center;color:#bfc8dc;min-height:1.5em}.note{position:absolute;width:70%;height:16px;left:15%;top:0;border-radius:999px;background:#fff;box-shadow:0 0 18px #fff;transform:translateY(0);will-change:transform}.start-screen{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,11,20,.82);z-index:10;backdrop-filter:blur(4px)}.start-button{min-width:220px;padding:18px 34px;border:1px solid rgba(255,255,255,.55);border-radius:12px;background:linear-gradient(135deg,#ffffff20,#ffffff08);color:#fff;font-size:28px;font-weight:900;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 28px rgba(255,255,255,.14)}.start-button:hover{background:linear-gradient(135deg,#ffffff32,#ffffff12);box-shadow:0 0 38px rgba(255,255,255,.25)}.start-button:focus-visible{outline:3px solid #fff;outline-offset:4px}.started .start-screen{display:none}.start-screen{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,11,20,.82);z-index:10;backdrop-filter:blur(4px)}.start-button{min-width:220px;padding:18px 34px;border:1px solid rgba(255,255,255,.55);border-radius:12px;background:linear-gradient(135deg,#ffffff20,#ffffff08);color:#fff;font-size:28px;font-weight:900;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 28px rgba(255,255,255,.14)}.start-button:hover{background:linear-gradient(135deg,#ffffff32,#ffffff12);box-shadow:0 0 38px rgba(255,255,255,.25)}.start-button:focus-visible{outline:3px solid #fff;outline-offset:4px}.started .start-screen{display:none}
  </style>
</head>
<body>
<main class="game" id="gameRoot">
  <div class="hud"><span id="stage">STAGE</span><span id="medley">MEDLEY</span><span id="score">0</span></div>
  <section class="lane-area" id="lanes" aria-label="6-key play area"></section>
  <div class="status" id="status">STARTを押してください</div><div class="start-screen" id="startScreen"><button class="start-button" id="startButton" type="button">START</button></div>
</main>
<script src="hdnote.js"></script>
<script src="hdgame.js"></script>
</body>
</html>
