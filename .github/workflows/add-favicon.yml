name: Add favicon to HTML files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add favicon links
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()
          changed = []

          for path in root.rglob("*.html"):
              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")
              if 'rel="icon"' in text or "rel='icon'" in text:
                  continue

              rel = Path(*([".."] * len(path.relative_to(root).parts[:-1])) , "favicon.png")
              href = rel.as_posix()
              marker = f'<link rel="icon" type="image/png" href="{href}">\n'

              if "</head>" in text:
                  text = text.replace("</head>", marker + "</head>", 1)
              elif "</HEAD>" in text:
                  text = text.replace("</HEAD>", marker + "</HEAD>", 1)
              else:
                  continue

              path.write_text(text, encoding="utf-8")
              changed.append(path.as_posix())

          if changed:
              print("Updated:")
              print("\n".join(changed))
          else:
              print("No HTML files needed changes.")

      - name: Commit changes and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git rm -f .github/workflows/add-favicon.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add favicon to all HTML files [skip ci]"
          git push
