name: Fix Heaven's Door opening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix door opening direction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hdop.html')
          s = p.read_text(encoding='utf-8')
          old = '@keyframes doorLeft{to{transform:rotateY(-82deg) translateX(-4%)}}@keyframes doorRight{to{transform:rotateY(82deg) translateX(4%)}}'
          new = '@keyframes doorLeft{to{transform:rotateY(82deg) translateX(-8%)}}@keyframes doorRight{to{transform:rotateY(-82deg) translateX(8%)}}'
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hdop.html .github/workflows/fix-hdop-door.yml
          git commit -m "Fix Heaven's Door opening direction"
          git rm .github/workflows/fix-hdop-door.yml
          git commit -m "Remove temporary door fix workflow"
          git push
