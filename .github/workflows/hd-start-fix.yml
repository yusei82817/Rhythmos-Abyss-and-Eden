name: Fix Heaven's Door START flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Heaven's Door
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hdgame.html')
          s=p.read_text()
          s=s.replace('.game{width:min(100vw,1100px);padding:20px}', '.game{width:min(100vw,1100px);padding:20px;position:relative}')
          s=s.replace('.note{position:absolute;width:70%;height:16px;left:15%;top:0;border-radius:999px;background:#fff;box-shadow:0 0 18px #fff;transform:translateY(0);will-change:transform}', '.note{position:absolute;width:70%;height:16px;left:15%;top:0;border-radius:999px;background:#fff;box-shadow:0 0 18px #fff;transform:translateY(0);will-change:transform}.start-screen{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,11,20,.82);z-index:10;backdrop-filter:blur(4px)}.start-button{min-width:220px;padding:18px 34px;border:1px solid rgba(255,255,255,.55);border-radius:12px;background:linear-gradient(135deg,#ffffff20,#ffffff08);color:#fff;font-size:28px;font-weight:900;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 28px rgba(255,255,255,.14)}.start-button:hover{background:linear-gradient(135deg,#ffffff32,#ffffff12);box-shadow:0 0 38px rgba(255,255,255,.25)}.start-button:focus-visible{outline:3px solid #fff;outline-offset:4px}.started .start-screen{display:none}')
          s=s.replace('<main class="game">', '<main class="game" id="gameRoot">')
          s=s.replace('<div class="status" id="status">A / S / D / J / K / L</div>', '<div class="status" id="status">STARTを押してください</div><div class="start-screen" id="startScreen"><button class="start-button" id="startButton" type="button">START</button></div>')
          p.write_text(s)

          p=Path('hdnote.js')
          s=p.read_text()
          s=s.replace("const progress = 1 - (untilHit + spawnLead) / spawnLead;\n        const clamped = Math.max(0, Math.min(1, progress));\n        note.element.style.transform = `translateY(${clamped * 100}%)`;", "const progress = 1 - (untilHit + spawnLead) / spawnLead;\n        const clamped = Math.max(0, Math.min(1, progress));\n        const travel = Math.max(0, (note.element.parentElement?.clientHeight || 400) - 50);\n        note.element.style.transform = `translateY(${clamped * travel}px)`;")
          p.write_text(s)

          p=Path('hdgame.js')
          s=p.read_text()
          start=s.index("let score = 0;")
          end=s.index("window.addEventListener('beforeunload'", start)
          replacement="""let score = 0;\nlet hits = 0;\nlet misses = 0;\nlet currentSongIndex = 0;\nlet audio = null;\nlet audioStarted = false;\nlet noteEngine = null;\n\nconst MEDLEYS = {\n  M01: [\n    { title: 'エメラルドヒル', src: 'エメラルドヒル.m4a' },\n    { title: '創国の夜明け', src: '創国の夜明け.mp3' },\n    { title: 'グローイングムーン', src: 'グローイングムーン.mp3' }\n  ]\n};\nconst playlist = MEDLEYS[medleyCode] || [];\n\nfunction playCurrentSong() {\n  const song = playlist[currentSongIndex];\n  if (!song) { statusEl.textContent = `FINISH  HIT ${hits} / MISS ${misses}`; return; }\n  if (audio) audio.pause();\n  audio = new Audio(song.src);\n  audio.preload = 'auto';\n  audio.volume = 1;\n  audio.addEventListener('ended', () => {\n    currentSongIndex++;\n    playCurrentSong();\n  }, { once:true });\n  audio.addEventListener('error', () => {\n    statusEl.textContent = `AUDIO ERROR: ${song.title}`;\n    console.error('Failed to load audio:', song.src);\n  }, { once:true });\n  audio.play().then(() => {\n    audioStarted = true;\n    statusEl.textContent = `${song.title} / A S D J K L`;\n  }).catch(err => console.error(err));\n}\n\nfunction startGame() {\n  if (audioStarted) return;\n  document.getElementById('gameRoot').classList.add('started');\n  audioStarted = true;\n  noteEngine = startHDNotes({\n    stageId,\n    lanes,\n    onHit(note, delta) {\n      hits++;\n      score += Math.max(50, 100 - Math.round(delta / 3));\n      scoreEl.textContent = String(score);\n      statusEl.textContent = `${LANE_KEYS[note.lane]} HIT`;\n    },\n    onMiss() { misses++; statusEl.textContent = 'MISS'; },\n    onEnd() { statusEl.textContent = `FINISH  HIT ${hits} / MISS ${misses}`; }\n  });\n  playCurrentSong();\n}\n\ndocument.getElementById('startButton').addEventListener('click', startGame);\n\ndocument.addEventListener('keydown', (event) => {\n  const lane = KEY_TO_LANE[event.key.toLowerCase()];\n  if (!audioStarted || lane === undefined || event.repeat) return;\n  noteEngine?.hitLane(lane);\n});\n\n"""
          s=s[:start]+replacement+s[end:]
          s=s.replace("window.addEventListener('beforeunload', () => {\n  noteEngine.stop();", "window.addEventListener('beforeunload', () => {\n  noteEngine?.stop();")
          s=s.replace("statusEl.textContent = playlist.length\n  ? `PRESS A KEY TO START / ${playlist[0].title}`\n  : 'MEDLEY DATA NOT FOUND';", "statusEl.textContent = playlist.length ? 'STARTを押してください' : 'MEDLEY DATA NOT FOUND';")
          p.write_text(s)
          PY
          rm -f tmp-test-hd hdgame.html.new another-temp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hdgame.html hdgame.js hdnote.js
          git add -A
          git diff --cached --quiet || git commit -m "Fix Heaven's Door START flow and note movement"
          git push
