<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GitHub Pagesで動くPython (Pyodide)</title>
</head>
<body>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

    <h1>GitHub Pages × Pyodide テスト</h1>
    <p>ブラウザのコンソール（F12キー）を開いて確認してください。</p>

    <script>
        async function main() {
            const pyodide = await loadPyodide();

            console.log("Python環境の準備が完了しました！");

            const result = await pyodide.runPythonAsync(`
                import sys
                print("これはPythonから出力されています！")

                x = 10
                y = 20
                x * y
            `);

            console.log("Pythonの計算結果:", result);
        }

        main();
    </script>

</body>
</html>
