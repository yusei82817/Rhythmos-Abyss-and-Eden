<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GitHub Pagesで動くPython (Pyodide)</title>
    <!-- 1. CDNからPyodideを読み込む -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>🐍 GitHub Pages × Pyodide テスト</h1>
    <p>ブラウザのコンソール（F12キー）を開いて確認してください。</p>

    <script type="text/javascript">
        async function main() {
            // 2. Pyodideの初期化（ブラウザ内にPython環境を作る）
            let pyodide = await loadPyodide();
            console.log("Python環境の準備が完了しました！");

            // 3. JavaScriptの中でPythonのコードを実行させる
            let result = await pyodide.runPythonAsync(`
                import sys
                print("これはPythonから出力されています！")
                
                # Pythonで計算
                x = 10
                y = 20
                x * y
            `);

            // 4. Pythonの計算結果をJavaScript側で受け取って表示
            console.log("Pythonの計算結果:", result); // 200が出力される
        }
        
        main();
    </script>
</body>
</html>
