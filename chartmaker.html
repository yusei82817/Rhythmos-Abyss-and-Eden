<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythmos AE - Chart Maker</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        padding: 20px;
    }
    h1 { margin: 0 0 16px; }
    .top {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
    }
    select, input, button {
        background: #222;
        color: #eee;
        border: 1px solid #555;
        border-radius: 6px;
        padding: 9px 12px;
        font-size: 14px;
    }
    button { cursor: pointer; }
    button:hover { background: #333; }
    .timer {
        position: fixed;
        top: 16px;
        right: 20px;
        font: 700 28px monospace;
        background: #000c;
        padding: 8px 12px;
        border-radius: 8px;
        z-index: 10;
    }
    .lanes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        max-width: 760px;
        height: 260px;
        margin: 20px auto;
        border: 2px solid #666;
    }
    .lane {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        border-right: 1px solid #555;
        padding-bottom: 15px;
        font-size: 30px;
        font-weight: bold;
        transition: background .08s;
    }
    .lane:last-child { border-right: 0; }
    .lane.flash { background: #fff; color: #111; }
    .controls { text-align: center; margin: 12px 0; }
    .controls button { margin: 4px; }
    .info {
        max-width: 760px;
        margin: 0 auto;
        background: #191919;
        padding: 14px;
        border-radius: 8px;
    }
    .notes {
        margin-top: 12px;
        max-height: 260px;
        overflow-y: auto;
        font-family: monospace;
        line-height: 1.6;
        border-top: 1px solid #444;
        padding-top: 8px;
    }
    .hint { color: #aaa; }
    .destination {
        margin-top: 8px;
        color: #8fd3ff;
        font-family: monospace;
        word-break: break-all;
    }
</style>
</head>
<body>
<h1>Rhythmos AE - Chart Maker</h1>
<div class="timer" id="timer">00:00.000</div>

<div class="top">
    <label>曲:
        <select id="song"></select>
    </label>
    <label>BPM:
        <input id="bpm" type="number" value="120" min="1" step="1">
    </label>
    <label>Offset:
        <input id="offset" type="number" value="0" step="0.001">
    </label>
    <label>出力名:
        <input id="filename" type="text" value="chart.json">
    </label>
</div>

<audio id="bgm" preload="metadata"></audio>

<div class="lanes" id="lanes"></div>

<div class="controls">
    <button id="play">▶ 再生</button>
    <button id="pause">⏸ 一時停止</button>
    <button id="restart">↺ 最初から</button>
    <button id="undo">↩ 直前削除</button>
    <button id="clear">🗑 全削除</button>
    <button id="export">JSON出力</button>
</div>

<div class="info">
    <div>ゲーム: <strong id="gameName">-</strong></div>
    <div>レーン: <strong id="laneCount">-</strong></div>
    <div>記録済みノーツ: <strong id="count">0</strong></div>
    <div class="hint" id="keyHint">曲を選択すると使用キーが表示されます。</div>
    <div class="destination" id="destination">出力先: -</div>
    <div class="notes" id="notes">まだノーツはありません。</div>
</div>

<script>
const song = document.getElementById('song');
const bgm = document.getElementById('bgm');
const timer = document.getElementById('timer');
const count = document.getElementById('count');
const notesEl = document.getElementById('notes');
const bpmEl = document.getElementById('bpm');
const offsetEl = document.getElementById('offset');
const filenameEl = document.getElementById('filename');
const lanesEl = document.getElementById('lanes');
const gameNameEl = document.getElementById('gameName');
const laneCountEl = document.getElementById('laneCount');
const keyHintEl = document.getElementById('keyHint');
const destinationEl = document.getElementById('destination');

const GAME_CONFIG = {
    'gfgame.html': {
        name: 'Abyss',
        laneKeys: ['A', 'D', 'J', 'L'],
        chartDir: 'chart/abyss'
    },
    'spgame.html': {
        name: 'Eden',
        laneKeys: ['A', 'D', 'J', 'L'],
        chartDir: 'chart/eden'
    },
    'hwgame.html': {
        name: 'Halloween',
        laneKeys: ['A', 'S', 'D', 'L'],
        chartDir: 'chart/halloween'
    },
    'srgame.html': {
        name: 'Surpass',
        laneKeys: ['A', 'S', 'D', 'F', 'J', 'K', 'L', ';'],
        chartDir: 'chart/surpass'
    }
};

let notes = [];
let songs = [];
let currentSong = null;
let currentKeys = [];

async function loadSongsFromGamePages() {
    const pages = Object.keys(GAME_CONFIG);
    const songList = [];

    for (const page of pages) {
        const config = GAME_CONFIG[page];

        try {
            const response = await fetch(page);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const html = await response.text();
            const regex = /initGame\(\s*['"]([^'"]+)['"]\s*,\s*['"]([^'"]+)['"]\s*\)/g;
            let match;

            while ((match = regex.exec(html)) !== null) {
                const filename = match[1];
                const mode = match[2];

                songList.push({
                    filename,
                    mode,
                    source: page,
                    game: config.name,
                    laneKeys: [...config.laneKeys],
                    chartDir: config.chartDir
                });
            }
        } catch (error) {
            console.warn(`曲一覧を読み込めませんでした: ${page}`, error);
        }
    }

    songs = songList;

    song.innerHTML = '';
    songs.forEach((item, index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = `[${item.game}] ${item.filename} [${item.mode}]`;
        song.appendChild(option);
    });

    if (songs.length > 0) {
        setSong();
    } else {
        gameNameEl.textContent = '-';
        keyHintEl.textContent = 'ゲームページから曲を取得できませんでした。';
        destinationEl.textContent = '出力先: -';
    }
}

function getCurrentSong() {
    const index = Number(song.value);
    return Number.isInteger(index) && songs[index] ? songs[index] : null;
}

function chartNameFromAudio(filename) {
    return decodeURIComponent(filename)
        .replace(/\.[^.]+$/, '')
        .trim() || 'chart';
}

function setSong() {
    const item = getCurrentSong();
    if (!item) return;

    currentSong = item;
    currentKeys = [...item.laneKeys];

    bgm.src = item.filename;
    bgm.load();
    bgm.currentTime = 0;

    renderLanes();
    updateSongInfo();

    filenameEl.value = `${chartNameFromAudio(item.filename)}.json`;
    updateTimer();
}

function renderLanes() {
    lanesEl.innerHTML = '';
    lanesEl.style.gridTemplateColumns = `repeat(${currentKeys.length}, 1fr)`;

    currentKeys.forEach((key, lane) => {
        const el = document.createElement('div');
        el.className = 'lane';
        el.dataset.lane = String(lane);
        el.textContent = key;
        lanesEl.appendChild(el);
    });
}

function updateSongInfo() {
    if (!currentSong) return;

    gameNameEl.textContent = currentSong.game;
    laneCountEl.textContent = String(currentSong.laneKeys.length);
    keyHintEl.textContent =
        `使用キー: ${currentSong.laneKeys.join(' / ')}`;

    destinationEl.textContent =
        `出力先: ${currentSong.chartDir}/${filenameEl.value.trim() || 'chart.json'}`;
}

function formatTime(seconds) {
    const min = Math.floor(seconds / 60).toString().padStart(2, '0');
    const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
    const ms = Math.floor((seconds % 1) * 1000).toString().padStart(3, '0');
    return `${min}:${sec}.${ms}`;
}

function updateTimer() {
    timer.textContent = formatTime(bgm.currentTime || 0);
    if (!bgm.paused) requestAnimationFrame(updateTimer);
}

function renderNotes() {
    count.textContent = notes.length;

    if (notes.length === 0) {
        notesEl.textContent = 'まだノーツはありません。';
        return;
    }

    notesEl.innerHTML = notes.map((note, index) =>
        `${String(index + 1).padStart(3, '0')} | ${note.time.toFixed(3)} | lane ${note.lane}`
    ).join('<br>');

    notesEl.scrollTop = notesEl.scrollHeight;
}

function flashLane(lane) {
    const el = lanesEl.querySelector(`.lane[data-lane="${lane}"]`);
    if (!el) return;

    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 80);
}

song.addEventListener('change', () => {
    bgm.pause();
    notes = [];
    renderNotes();
    setSong();
});

filenameEl.addEventListener('input', updateSongInfo);

document.getElementById('play').addEventListener('click', async () => {
    try {
        await bgm.play();
        updateTimer();
    } catch (err) {
        console.error(err);
    }
});

document.getElementById('pause').addEventListener('click', () => {
    bgm.pause();
    updateTimer();
});

document.getElementById('restart').addEventListener('click', () => {
    bgm.currentTime = 0;
    updateTimer();
});

document.getElementById('undo').addEventListener('click', () => {
    if (notes.length === 0) return;
    notes.pop();
    renderNotes();
});

document.getElementById('clear').addEventListener('click', () => {
    notes = [];
    renderNotes();
});

document.getElementById('export').addEventListener('click', () => {
    if (!currentSong) return;

    const data = {
        bpm: Number(bpmEl.value) || 120,
        offset: Number(offsetEl.value) || 0,
        notes: [...notes].sort((a, b) => a.time - b.time)
    };

    const blob = new Blob(
        [JSON.stringify(data, null, 2)],
        { type: 'application/json' }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filenameEl.value.trim() || 'chart.json';
    a.click();
    URL.revokeObjectURL(url);
});

window.addEventListener('keydown', (e) => {
    if (e.repeat || !currentSong) return;

    const key = e.key.toLowerCase();
    const lane = currentKeys.findIndex(value => value.toLowerCase() === key);

    if (lane === -1) return;

    e.preventDefault();

    if (bgm.paused || bgm.ended) return;

    notes.push({
        time: Number(bgm.currentTime.toFixed(3)),
        lane
    });

    flashLane(lane);
    renderNotes();
});

bgm.addEventListener('timeupdate', () => {
    timer.textContent = formatTime(bgm.currentTime);
});

bgm.addEventListener('play', updateTimer);

loadSongsFromGamePages();
renderNotes();
</script>
</body>
</html>
