<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>20D Hypercube - WebGL</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#e9edf7;font-family:system-ui,sans-serif}body{display:grid;place-items:center}main{position:relative;width:100vw;height:100vh}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:10px;left:12px;right:12px;pointer-events:none;text-shadow:0 1px 4px #000;font-size:13px;line-height:1.45}.title{font-weight:800;font-size:16px}.sub{opacity:.7}.hint{position:absolute;bottom:10px;left:12px;right:12px;text-align:center;opacity:.55;font-size:12px;pointer-events:none}#error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#fff;background:#05070d;white-space:pre-line}button{position:absolute;right:12px;top:10px;z-index:2;background:#111827;color:#fff;border:1px solid #ffffff30;border-radius:7px;padding:6px 9px;cursor:pointer}button:hover{background:#182033}
</style>
</head>
<body>
<main>
<canvas id="gl"></canvas>
<div class="hud"><div class="title">20D HYPERCUBE</div><div class="sub">2²⁰ = 1,048,576 vertices · GPU-generated · WebGL2</div></div>
<button id="pause">PAUSE</button>
<div class="hint">ドラッグ: 回転　ホイール: 拡大縮小　R: リセット</div>
<div id="error" hidden></div>
</main>
<script>
'use strict';
const canvas=document.getElementById('gl');
const errorEl=document.getElementById('error');
const pauseBtn=document.getElementById('pause');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:false});
if(!gl){errorEl.hidden=false;errorEl.textContent='WebGL2 が利用できません。';throw new Error('WebGL2 unavailable');}

// 20D -> 3D -> 2D をGPU側で行う。1,048,576頂点をJS配列に展開しないのが軽量化の要点。
const vs=`#version 300 es
precision highp float;
precision highp int;
uniform float uTime;
uniform float uScale;
uniform vec2 uRot;
uniform float uAspect;
out float vDepth;

// 20次元の超立方体頂点を gl_VertexID の20bitから復元。
vec4 rotate4(vec4 p,float a,float b){
  float ca=cos(a),sa=sin(a),cb=cos(b),sb=sin(b);
  float x=p.x*ca-p.w*sa; float w=p.x*sa+p.w*ca;
  p.x=x; p.w=w;
  float y=p.y*cb-p.z*sb; float z=p.y*sb+p.z*cb;
  p.y=y; p.z=z;
  return p;
}

void main(){
  uint id=uint(gl_VertexID);
  float d[20];
  for(int i=0;i<20;i++) d[i]=((id>>uint(i))&1u)==0u ? -1.0 : 1.0;

  // 20Dを3Dへ圧縮。各次元に異なる位相を与え、単なる3D立方体にならないようにする。
  float x=0.0,y=0.0,z=0.0;
  for(int i=0;i<20;i++){
    float ph=float(i)*0.83;
    x += d[i]*cos(ph)*0.22;
    y += d[i]*sin(ph)*0.22;
    z += d[i]*sin(ph*1.37)*0.22;
  }

  // 時間変化する高次元回転。全190平面を毎フレーム計算するのは重すぎるため、
  // 代表的な6平面だけをGPUで回し、20D構造の投影を軽量に見せる。
  vec4 a=vec4(x,y,z,d[19]);
  a=rotate4(a,uRot.x,uRot.y);
  x=a.x;y=a.y;z=a.z;
  float w=a.w;

  // 追加の4次元成分を3Dへ少量混ぜる。
  for(int i=0;i<19;i++){
    float q=d[i]*0.045;
    x += q*sin(uTime*0.35+float(i)*1.11);
    y += q*cos(uTime*0.31+float(i)*0.91);
    z += q*sin(uTime*0.27+float(i)*1.47);
  }

  // 4D遠近投影。wが大きい点ほど少し拡大される。
  float persp=1.0/(3.7-0.42*w);
  x*=persp;y*=persp;z*=persp;

  // 3D→2D。奥行きは点サイズと明度に使用。
  float depth=1.0/(2.8-0.20*z);
  float sx=x*depth*uScale/uAspect;
  float sy=y*depth*uScale;
  gl_Position=vec4(sx,sy,0.0,1.0);
  gl_PointSize=1.0+2.0*depth;
  vDepth=clamp(depth*0.65,0.0,1.0);
}`;
const fs=`#version 300 es
precision mediump float;
in float vDepth;
out vec4 outColor;
void main(){
  vec2 p=gl_PointCoord-0.5;
  float r=dot(p,p);
  if(r>0.25) discard;
  float a=smoothstep(0.25,0.04,r)*vDepth;
  outColor=vec4(0.78,0.88,1.0,a);
}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
const uTime=gl.getUniformLocation(program,'uTime');
const uScale=gl.getUniformLocation(program,'uScale');
const uRot=gl.getUniformLocation(program,'uRot');
const uAspect=gl.getUniformLocation(program,'uAspect');

let scale=0.46,rx=0.0,ry=0.0,drag=false,lx=0,ly=0,paused=false;
function resize(){const d=Math.min(devicePixelRatio||1,1.5);const w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
addEventListener('resize',resize);resize();
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;rx+=(e.clientX-lx)*0.008;ry+=(e.clientY-ly)*0.008;lx=e.clientX;ly=e.clientY});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();scale*=Math.exp(-e.deltaY*0.001);scale=Math.max(0.12,Math.min(1.2,scale))},{passive:false});
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'){scale=0.46;rx=ry=0}});
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'PLAY':'PAUSE'};

let start=performance.now(),last=0;
function frame(now){resize();if(!paused)last=(now-start)/1000;gl.clearColor(0.02,0.027,0.05,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(program);gl.bindVertexArray(vao);gl.uniform1f(uTime,last);gl.uniform1f(uScale,scale);gl.uniform2f(uRot,rx+last*0.19,ry+last*0.13);gl.uniform1f(uAspect,canvas.width/canvas.height);gl.drawArrays(gl.POINTS,0,1048576);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
