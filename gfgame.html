    background:rgba(220,20,60,.35);
    box-shadow:0 0 18px gold;
    transform:scale(1.04);
}
#menu-video-bg {
    position: fixed;
    inset: 0;

}
#menu-video-overlay {

}

<script type="module" src="game.js"></script>
<script>
/*
 * ソングカード解禁日時設定
 *
 * data-release=""              = 即時解禁
 * data-release="2026-09-20T00:00:00+09:00" = 指定日時まで非表示
 *
 * 日付は日本時間(+09:00)で設定できます。
 */
function updateSongUnlocks() {
    const now = new Date();

    document.querySelectorAll('#song-list .song-card').forEach(card => {
        const release = card.dataset.release;

        if (!release) {
            card.style.display = '';
            return;
        }

        const releaseTime = new Date(release);
        card.style.display = Number.isNaN(releaseTime.getTime()) || now >= releaseTime ? '' : 'none';
    });
}

updateSongUnlocks();
</script>
