<!DOCTYPE html>
<html lang="ja">
<head>

<title>Rhythmos Abyss</title>
<link rel="stylesheet" href="gfstyle.css">
<style>
#top-button{
    position:fixed;
    top:16px;
    left:16px;
    z-index:1000;
    padding:8px 18px;
    font-size:16px;
    color:white;
    background:rgba(5,2,0,.72);
    border:2px solid #fff8dc;
    border-radius:8px;
    cursor:pointer;
    box-shadow:0 0 10px rgba(255,215,0,.45);
    backdrop-filter:blur(5px);
}
#top-button:hover{
    background:rgba(220,20,60,.35);
    box-shadow:0 0 18px gold;
    transform:scale(1.04);
}
#menu-video-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    pointer-events: none;
    background: #000;
}
#menu-video-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    z-index: -1;
    pointer-events: none;
}
</style>
</head>
<body>

<audio id="bgm"></audio>
<audio id="menu-bgm" src="Abyss%20menu.mp3" loop preload="auto"></audio>
<script type="module" src="game.js"></script>
<script>
const menuBgm = document.getElementById('menu-bgm');

function startMenuBgm() {
    menuBgm.currentTime = 0;
    menuBgm.play().catch(() => {
        document.addEventListener('click', () => menuBgm.play(), { once: true });
    });
}

startMenuBgm();

const menuVideo = document.getElementById('menu-video-bg');
const menuVideos = [
    'video/115202_640x360.mp4',
    'video/220170_640x360.mp4'
];
let menuVideoIndex = 0;

function playMenuVideo() {
    menuVideo.src = menuVideos[menuVideoIndex];
    menuVideo.currentTime = 0;
    const promise = menuVideo.play();
    if (promise) promise.catch(() => {
        document.addEventListener('click', () => menuVideo.play(), { once: true });
    });
}

menuVideo.addEventListener('ended', () => {
    menuVideoIndex = (menuVideoIndex + 1) % menuVideos.length;
    playMenuVideo();
});

playMenuVideo();
</script>
