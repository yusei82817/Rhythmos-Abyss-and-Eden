<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythmos Dancing</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #fff; }
        #container { position: relative; width: 100vw; height: 100vh; overflow: hidden; transition: transform 0.5s ease; }
        video { transform: scaleX(-1); position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; }
        canvas { transform: scaleX(-1); position: absolute; width: 100%; height: 100%; object-fit: cover; }

        #lanes { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
        .lane {
            position: absolute;
            top: 8%;
            bottom: 8%;
            width: 22%;
            border-left: 3px solid rgba(255,255,255,0.35);
            border-right: 3px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.035);
        }
        .left-lane { left: 27%; }
        .right-lane { right: 27%; }
        
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; }
        .score-display { font-size: 48px; font-weight: bold; color: #0f0; text-shadow: 0 0 10px #0f0; }
        
        /* リセットボタンのスタイル */
        #resetBtn { 
            background: rgba(255, 0, 0, 0.3); color: #fff; border: 1px solid #f00; 
            padding: 5px 15px; cursor: pointer; font-size: 12px; margin-bottom: 10px;
            pointer-events: auto; transition: 0.3s;
        }
        #resetBtn:hover { background: rgba(255, 0, 0, 0.8); }

        /* 演出用クラス（前回同様） */
        .glitch-mid { animation: shake-mid 0.2s infinite; filter: contrast(150%) hue-rotate(45deg); }
        .glitch-hard { animation: shake-hard 0.1s infinite; filter: invert(1) contrast(200%); }
        .system-collapse { 
            animation: collapse-anim 0.05s infinite; filter: invert(1) sepia(100%) hue-rotate(300deg);
            transform: rotate(180deg) scale(1.1) !important; 
        }
        @keyframes shake-mid { 0% { transform: translate(2px,-2px); } 50% { transform: translate(-2px,2px); } }
        @keyframes shake-hard { 0% { transform: translate(5px,5px); } 50% { transform: translate(-5px,-5px); } }
        @keyframes collapse-anim { 0% { clip-path: inset(20% 0 50% 0); } 50% { transform: rotate(182deg); } }

        #overlay {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer; text-align: center;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="input_video"></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="ui">
        <button id="resetBtn">SYSTEM RESET</button>
        <div style="font-size: 14px;">TIME: <span id="timeVal">120</span>s</div>
        <div class="score-display">SCORE: <span id="scoreVal">0</span></div>
    </div>


    <div id="lanes">
        <div class="lane left-lane"></div>
        <div class="lane right-lane"></div>
    </div>

    <div id="overlay">
        <h1 style="color:#0f0">RHYTHMOS DANCING</h1>
        <p>右手・左手・右膝・左膝を使ってターゲットを狙え。音楽なしのテスト版。</p>
        <button style="padding:15px 40px; background:#0f0; border:none; font-weight:bold;">INITIALIZE</button>
    </div>
</div>

<script>
let score = 0, timeLeft = 120, gameActive = false, gameTimer = null;
let target = { x: 0.62, y: 0.5, part: 'rightHand', lane: 'right' };
console.log("let Працює добре");
    
// リセット機能のコア
function resetGame() {
    clearInterval(gameTimer);
    gameActive = false;
    score = 0;
    timeLeft = 120;
    
    // UIと演出の初期化
    document.getElementById('scoreVal').innerText = "0";
    document.getElementById('timeVal').innerText = "120";
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('container').className = "";
    
    console.log("System Reset Працює добре");
}

function moveTarget() {
    const lane = Math.random() < 0.5 ? 'left' : 'right';

    target.lane = lane;
    target.part = lane === 'left'
        ? (Math.random() < 0.5 ? 'leftHand' : 'leftKnee')
        : (Math.random() < 0.5 ? 'rightHand' : 'rightKnee');
    console.log("function moveTarget lane&part Працює добре");

    if (target.part === 'leftHand') {
        // 手はレーン中央付近
        target.x = 0.38;
        target.y = 0.25 + Math.random() * 0.35;
    } else if (target.part === 'rightHand') {
        // 手はレーン中央付近
        target.x = 0.62;
        target.y = 0.25 + Math.random() * 0.35;
    } else if (target.part === 'leftKnee') {
        // 膝はレーン内で位置をランダム化
        target.x = 0.31 + Math.random() * 0.14;
        target.y = 0.45 + Math.random() * 0.40;
    } else {
        // 膝はレーン内で位置をランダム化
        target.x = 0.55 + Math.random() * 0.14;
        target.y = 0.45 + Math.random() * 0.40;

    }
}
console.log("function moveTarget Працює добре");
function onResults(results) {
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (gameActive) {
        const container = document.getElementById('container');

        if (score >= 70) container.className = "system-collapse";
        else if (score >= 60) container.className = "glitch-hard";
        else if (score >= 45) container.className = "glitch-mid";
        else container.className = "";

        // 姿勢ランドマークが取得できた場合だけ判定を行う。
        if (results.poseLandmarks) {
            const landmarkMap = {
                rightHand: 15,
                leftHand: 16,
                rightKnee: 25,
                leftKnee: 26
            };

            const threshold = 0.1;
            const pt = results.poseLandmarks[landmarkMap[target.part]];

            if (pt && pt.visibility > 0.5) {
                if (Math.sqrt((pt.x - target.x) ** 2 + (pt.y - target.y) ** 2) < threshold) {
                    score++;
                    document.getElementById('scoreVal').innerText = score;
                    moveTarget();
                }
            }
        }

        // ターゲット表示は姿勢検出の成否に関係なく行う。
        const targetColor = {
            rightHand: '#00aaff',
            leftHand: '#00aaff',
            rightKnee: '#ff3030',
            leftKnee: '#ff3030'
        }[target.part];

        const drawSymbol = {
            rightHand: '▶',
            leftHand: '◀',
            rightKnee: '▶',
            leftKnee: '◀'
        }[target.part];

        const targetX = target.x * canvasElement.width;
        const targetY = target.y * canvasElement.height;

        canvasCtx.font = 'bold 80px Arial';
        canvasCtx.textAlign = 'center';
        canvasCtx.textBaseline = 'middle';
        canvasCtx.lineWidth = 6;
        canvasCtx.strokeStyle = '#000';
        canvasCtx.fillStyle = targetColor;

        canvasCtx.strokeText(drawSymbol, targetX, targetY);
        canvasCtx.fillText(drawSymbol, targetX, targetY);
    }
    canvasCtx.restore();
}
console.log("canvas Працює добре")
const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
pose.onResults(onResults);
const camera = new Camera(document.getElementById('input_video'), {
    onFrame: async () => { await pose.send({image: document.getElementById('input_video')}); },
    width: 1280, height: 720
});
camera.start();

// スタートイベント
document.getElementById('overlay').addEventListener('click', () => {
    if (!gameActive) {
        gameActive = true;
        document.getElementById('overlay').style.display = 'none';
        moveTarget();
        gameTimer = setInterval(() => {
            timeLeft--;
            document.getElementById('timeVal').innerText = timeLeft;
            if (timeLeft <= 0) resetGame(); // 時間切れでリセット（またはリザルトへ）
        }, 1000);
    }
    console.log("Start Event Працює добре");
});

// リセットボタンイベント
document.getElementById('resetBtn').addEventListener('click', (e) => {
    e.stopPropagation(); // オーバーレイのクリック連動を防止
    resetGame();
    console.log("reset event Працює добре");
});
</script>
</body>
</html>
