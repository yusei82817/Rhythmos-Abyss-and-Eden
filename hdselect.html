<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Heaven's Door - Stage Select</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#071018;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px;overflow-x:hidden}
    .wrap{width:min(1100px,100%)}
    h1{margin:0 0 8px;text-align:center;letter-spacing:.12em;font-size:clamp(28px,5vw,52px)}
    .sub{margin:0 0 28px;text-align:center;color:#b9c8d6;letter-spacing:.16em}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
    .stage-card{position:relative;min-height:420px;border:1px solid rgba(255,255,255,.32);border-radius:22px;overflow:hidden;cursor:pointer;isolation:isolate;background:linear-gradient(145deg,#dffaff,#8eb4ff 42%,#15203d 43%,#070b18);box-shadow:0 18px 45px rgba(0,0,0,.45);transition:transform .35s ease,box-shadow .35s ease}
    .stage-card::before{content:"";position:absolute;inset:-60%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.05) 42%,rgba(255,255,255,.8) 48%,rgba(255,220,255,.12) 54%,transparent 62%);transform:translateX(-55%) rotate(8deg);animation:holo 5s linear infinite;z-index:-1}
    .stage-card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.85),transparent 18%),linear-gradient(135deg,rgba(255,80,180,.14),rgba(80,240,255,.1) 35%,rgba(255,230,120,.1) 70%,rgba(150,100,255,.18));mix-blend-mode:screen;pointer-events:none}
    .stage-card:hover{transform:translateY(-8px) rotateX(2deg);box-shadow:0 28px 60px rgba(0,0,0,.58),0 0 35px rgba(150,220,255,.28)}
    .face{position:relative;z-index:1;padding:28px;height:100%;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 10px rgba(0,0,0,.55)}
    .stage-no{font-size:14px;font-weight:800;letter-spacing:.2em}
    .title{font-family:Georgia,serif;font-size:clamp(34px,6vw,58px);line-height:.95;letter-spacing:.04em}
    .songs{margin-top:18px;padding:14px 16px;border:1px solid rgba(255,255,255,.28);border-radius:14px;background:rgba(0,0,0,.2);backdrop-filter:blur(7px);font-size:14px;line-height:1.7}
    .songs b{display:block;color:#dffaff;margin-bottom:4px;letter-spacing:.1em}
    .footer{display:flex;justify-content:space-between;align-items:end;gap:12px}
    .difficulty{font-size:12px;letter-spacing:.16em;font-weight:800}
    .flip{font-size:11px;opacity:.75;letter-spacing:.12em}
    @keyframes holo{to{transform:translateX(55%) rotate(8deg)}}
    @media(prefers-reduced-motion:reduce){.stage-card::before{animation:none}.stage-card{transition:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>HEAVEN'S DOOR</h1>
    <p class="sub">STAGE SELECT</p>
    <section class="grid" aria-label="ステージ一覧">
      <article class="stage-card" id="stage01" tabindex="0" role="button" aria-label="Stage 01 Prologue を選択">
        <div class="face">
          <div>
            <div class="stage-no">STAGE 01</div>
          </div>
          <div>
            <div class="title">Prologue</div>
            <div class="songs">
              <b>MEDLEY</b>
              エメラルドヒル.m4a<br>
              創国の夜明け.mp3<br>
              グローイングムーン.mp3
            </div>
          </div>
          <div class="footer">
            <span class="difficulty">NORMAL · 3 SONGS</span>
            <span class="flip">▶ SELECT</span>
          </div>
        </div>
      </article>
    </section>
  </main>
  <script>
    const card = document.getElementById('stage01');
    const open = () => {
      window.location.href = 'hdgame.html?stage=HD01&medley=M01';
    };
    card.addEventListener('click', open);
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
  </script>
</body>
</html>
