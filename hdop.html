<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rhythmos - Heaven's Door</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030b;color:#fff;font-family:Arial,Helvetica,sans-serif}body{touch-action:manipulation}
#scene{position:relative;width:100%;height:100%;overflow:hidden;background:#02030b}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#skip{position:absolute;z-index:50;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));min-width:76px;min-height:44px;padding:10px 16px;border:1px solid rgba(255,255,255,.55);border-radius:8px;background:rgba(0,0,0,.32);color:#fff;letter-spacing:.12em;cursor:pointer}
#hint{position:absolute;z-index:45;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);opacity:0;pointer-events:none;color:rgba(255,255,255,.82);font-size:14px;letter-spacing:.18em;white-space:nowrap;transition:opacity .45s}.show{opacity:1!important}
#logo{position:absolute;z-index:35;left:50%;top:50%;width:min(78vw,760px);transform:translate(-50%,-50%);opacity:0;text-align:center;pointer-events:none;filter:drop-shadow(0 0 18px rgba(255,255,255,.34))}.logoShow{animation:logoIn 1.25s cubic-bezier(.2,.8,.2,1) forwards}.brand{font-weight:900;font-size:clamp(54px,10vw,112px);line-height:.88;white-space:nowrap;transform-origin:left center}.subtitleWrap{position:relative;width:100%;margin-top:12px}.subtitle{font-weight:700;font-size:clamp(28px,5vw,58px);line-height:1;letter-spacing:.025em;white-space:nowrap}
#arrow{position:absolute;left:0;right:0;top:calc(100% + 12px);height:18px;transform:translateX(-115%);opacity:0}.arrowGo{animation:arrowFly .95s cubic-bezier(.18,.8,.16,1) forwards}.shaft{position:absolute;left:0;right:12px;top:8px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.25),#fff 22%,#fff 82%,rgba(255,255,255,.7));box-shadow:0 0 7px rgba(255,255,255,.75)}.head{position:absolute;right:0;top:2px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:15px solid #fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.9))}.feather{position:absolute;left:3px;top:1px;width:17px;height:14px;border-left:2px solid rgba(255,255,255,.85);border-top:2px solid rgba(255,255,255,.55);transform:skewX(-28deg) rotate(-18deg);opacity:.8}
#doorGlow{position:absolute;z-index:25;left:50%;top:50%;width:min(62vw,650px);aspect-ratio:1/1.45;transform:translate(-50%,-50%) scale(.65);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(235,246,255,.55) 20%,rgba(180,220,255,.18) 48%,transparent 72%);filter:blur(8px);opacity:0}.doorGlowIn{animation:glowIn 1.3s ease forwards}
#door{position:absolute;z-index:30;left:50%;top:50%;width:min(42vw,460px);height:min(58vw,620px);max-height:70vh;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:auto;cursor:pointer}.doorIn{animation:doorIn 1.1s cubic-bezier(.2,.8,.2,1) forwards}.frame{position:absolute;inset:0;border:16px solid #5b351f;border-radius:12px 12px 3px 3px;background:linear-gradient(90deg,#2d160d,#7a4b2b 18%,#3c2114 48%,#80522d 76%,#2b150b);box-shadow:0 0 0 4px #bd8b4d,0 0 25px rgba(255,190,90,.25),inset 0 0 30px rgba(0,0,0,.55)}.arch{position:absolute;left:6%;right:6%;top:-5%;height:25%;border:12px solid #6b3e22;border-bottom:0;border-radius:50% 50% 0 0;background:linear-gradient(90deg,#3a1e10,#9a6030,#3b1d0f);box-shadow:0 0 0 3px #d2a15a}.left,.right{position:absolute;top:13%;bottom:2%;width:48%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 8px,rgba(0,0,0,.08) 8px 18px),linear-gradient(90deg,#4b2816,#8a542d 42%,#3a1c0d);border:4px solid #c18a4d;box-shadow:inset 0 0 22px rgba(0,0,0,.48)}.left{left:2%;transform-origin:right center;border-radius:4px 0 0 4px}.right{right:2%;transform-origin:left center;border-radius:0 4px 4px 0}.panel{position:absolute;inset:12%;border:2px solid rgba(228,182,107,.65);box-shadow:inset 0 0 12px rgba(0,0,0,.35)}.knob{position:absolute;top:48%;width:18px;height:18px;border-radius:50%;background:#e2bd70;box-shadow:0 0 8px rgba(255,224,145,.7)}.left .knob{right:7px}.right .knob{left:7px}.crack{position:absolute;left:50%;top:13%;bottom:2%;width:3px;transform:translateX(-50%);background:rgba(255,255,255,.45);box-shadow:0 0 12px rgba(255,255,255,.45)}.opening .left{animation:doorLeft 1.1s cubic-bezier(.18,.8,.2,1) forwards}.opening .right{animation:doorRight 1.1s cubic-bezier(.18,.8,.2,1) forwards}.opening .crack{animation:crackFade .45s ease forwards}
#doorPrompt{position:absolute;z-index:40;left:50%;top:calc(50% + min(33vw,350px));transform:translateX(-50%);color:rgba(255,255,255,.78);font-size:13px;letter-spacing:.16em;opacity:0;pointer-events:none;text-align:center;white-space:nowrap}.promptShow{opacity:1;transition:opacity .5s}
#flash{position:absolute;z-index:60;inset:0;background:#000;opacity:0;pointer-events:none}.blackFlash{animation:blackFlash .5s ease forwards}
#audioPopup{position:absolute;z-index:100;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}#audioCard{width:min(88vw,440px);padding:28px 24px;border:1px solid rgba(255,255,255,.32);border-radius:16px;background:rgba(12,16,32,.94);box-shadow:0 20px 70px rgba(0,0,0,.55);text-align:center}#audioCard h1{margin:0 0 10px;font-size:24px}#audioCard p{margin:0 0 22px;color:rgba(255,255,255,.72);line-height:1.7;font-size:14px}#startButton{min-height:48px;padding:12px 26px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:800;letter-spacing:.08em;cursor:pointer}#audioStatus{min-height:1.3em;margin-top:12px;color:rgba(255,255,255,.62);font-size:12px}
@keyframes logoIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.92);filter:brightness(2.4) drop-shadow(0 0 28px rgba(255,255,255,.95))}55%{opacity:1;transform:translate(-50%,-50%) scale(1.03);filter:brightness(1.35) drop-shadow(0 0 26px rgba(255,255,255,.65))}100%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:brightness(1) drop-shadow(0 0 18px rgba(255,255,255,.34))}}@keyframes arrowFly{0%{transform:translateX(-115%);opacity:0}12%{opacity:1}100%{transform:translateX(115%);opacity:0}}@keyframes doorIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.03)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes glowIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}100%{opacity:.75;transform:translate(-50%,-50%) scale(1.05)}}@keyframes doorLeft{to{transform:rotateY(82deg) translateX(-8%)}}@keyframes doorRight{to{transform:rotateY(-82deg) translateX(8%)}}@keyframes crackFade{to{opacity:0}}@keyframes blackFlash{0%{opacity:0}30%{opacity:1}58%{opacity:1}100%{opacity:0}}
@media(max-width:600px){#skip{font-size:13px;padding:9px 13px}#hint{font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style><link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="scene"><canvas id="fx"></canvas><button id="skip" type="button">SKIP</button><div id="doorGlow"></div><div id="door"><div class="frame"></div><div class="arch"></div><div class="left"><div class="panel"></div><div class="knob"></div></div><div class="right"><div class="panel"></div><div class="knob"></div></div><div class="crack"></div></div><div id="doorPrompt">DOUBLE TAP THE DOOR</div><div id="logo"><div class="brand">Rhythmos</div><div class="subtitleWrap"><div class="subtitle">Heaven's Door</div><div id="arrow"><span class="feather"></span><span class="shaft"></span><span class="head"></span></div></div></div><div id="hint">TAP TO CONTINUE</div><div id="flash"></div></div>
<div id="audioPopup"><div id="audioCard"><h1>Heaven's Door</h1><p>このOPでは「滴.mp3」を再生します。<br>ブラウザの自動再生制限を避けるため、開始ボタンを押してください。</p><button id="startButton" type="button">再生して開始</button><div id="audioStatus"></div></div></div>
<audio id="bgm" preload="auto" src="./滴.mp3"></audio>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('fx'),ctx=canvas.getContext('2d'),skip=$('skip'),door=$('door'),glow=$('doorGlow'),prompt=$('doorPrompt'),logo=$('logo'),hint=$('hint'),flash=$('flash'),popup=$('audioPopup'),startButton=$('startButton'),status=$('audioStatus'),audio=$('bgm'),brand=logo.querySelector('.brand'),subtitle=logo.querySelector('.subtitle');
const NEXT_HTML='hdselect.html';let w=0,h=0,dpr=1,start=0,last=0,raf=0,stopped=false,doorVisible=false,doorOpened=false,titleVisible=false,arrowDone=false,lastDoorTap=0;
const feathers=[],meteors=[],stars=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,eio=t=>t*t*(3-2*t),eic=t=>t*t*t;
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=Math.max(1,innerWidth);h=Math.max(1,innerHeight);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!stars.length)for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*.72,r:.5+Math.random()*1.5,a:.25+Math.random()*.7,p:Math.random()*6.28})}addEventListener('resize',resize,{passive:true});resize();
function feather(){feathers.push({x:Math.random()*w,y:-50,vy:25+Math.random()*65,r:Math.random()*6.28,vr:-1.3+Math.random()*2.6,s:.45+Math.random()*.75,a:.35+Math.random()*.55,p:Math.random()*6.28})}
function meteor(){meteors.push({x:Math.random()*w,y:-80-Math.random()*180,vx:-35+Math.random()*70,vy:210+Math.random()*300,s:8+Math.random()*20,r:Math.random()*6.28,vr:-2+Math.random()*4})}
function sky(t){let a,b;if(t<10){let q=clamp(t/10,0,1);a=[28+28*q,80+35*q,170+45*q];b=[8+25*q,24+26*q,74+40*q]}else{let q=clamp((t-10)/10,0,1),s=[[28,70,170],[238,150,72],[160,63,78],[52,34,87],[4,8,28]],x=q*(s.length-1),i=Math.floor(x),j=Math.min(s.length-1,i+1),f=x-i;a=s[i].map((v,k)=>lerp(v,s[j][k],f));b=a.map(v=>v*.25)}let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,`rgb(${a.map(Math.round).join(',')})`);g.addColorStop(1,`rgb(${b.map(Math.round).join(',')})`);ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function drawStars(t){if(t<19)return;let q=clamp((t-19)/11,0,1);for(const s of stars){ctx.fillStyle=`rgba(255,255,255,${s.a*q*(.65+.35*Math.sin(t*1.8+s.p))})`;ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fill()}}
function sun(t){if(t<6)return;let x=w*.5,y=lerp(h*.22,h*.84,eio(clamp((t-10)/10,0,1))),i=t<10?clamp((t-6)/4,0,1):1-clamp((t-10)/10,0,1)*.88,r=Math.min(w,h)*.065,g=ctx.createRadialGradient(x,y,0,x,y,r*5);g.addColorStop(0,`rgba(255,255,255,${.98*i})`);g.addColorStop(.2,`rgba(255,248,205,${.9*i})`);g.addColorStop(.45,`rgba(255,190,85,${.25*i})`);g.addColorStop(1,'rgba(255,140,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*5,0,Math.PI*2);ctx.fill();ctx.fillStyle=`rgba(255,252,225,${i})`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function moon(t){if(t<20)return;let q=clamp((t-20)/10,0,1),x=w*.72,y=lerp(h*.88,h*.34,eio(q)),r=Math.min(w,h)*.055,g=ctx.createRadialGradient(x,y,0,x,y,r*3.5);g.addColorStop(0,'rgba(245,250,255,.9)');g.addColorStop(.3,'rgba(190,215,255,.35)');g.addColorStop(1,'rgba(150,190,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e9f2ff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function redMoon(t){if(t<30||t>35.2)return;let q=clamp((t-30)/4,0,1),r=Math.min(w,h)*.11,x=lerp(w+r*1.2,w*.72,eic(q)),y=h*.34,g=ctx.createRadialGradient(x,y,0,x,y,r*3.2);g.addColorStop(0,'rgba(255,80,70,.9)');g.addColorStop(.35,'rgba(210,20,25,.35)');g.addColorStop(1,'rgba(120,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8f1117';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function drawFeathers(t,dt){if(t>=2&&t<5&&feathers.length<28)feather();for(let i=feathers.length-1;i>=0;i--){let f=feathers[i];f.y+=f.vy*dt;f.x+=Math.sin(t*1.7+f.p)*18*dt;f.r+=f.vr*dt;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.r);ctx.scale(f.s,f.s);ctx.globalAlpha=f.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,28);ctx.quadraticCurveTo(-3,6,-18,-2);ctx.bezierCurveTo(-27,-8,-25,-24,-10,-31);ctx.bezierCurveTo(-4,-33,-1,-30,0,-25);ctx.bezierCurveTo(3,-30,8,-28,15,-22);ctx.bezierCurveTo(25,-13,23,-2,13,5);ctx.quadraticCurveTo(6,11,0,28);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(180,195,215,.8)';ctx.stroke();ctx.restore();if(f.y>h+80)feathers.splice(i,1)}}
function drawMeteors(t,dt){if(t<35)return;if(meteors.length<22&&t<41)for(let i=meteors.length;i<22;i++)meteor();for(let i=meteors.length-1;i>=0;i--){let m=meteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;m.r+=m.vr*dt;if(m.y>h+100){meteors.splice(i,1);continue}ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.r);ctx.fillStyle='rgba(255,140,50,.55)';ctx.beginPath();ctx.ellipse(0,m.s*2,m.s*.25,m.s*2.8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b7bcc5';ctx.beginPath();ctx.arc(0,0,m.s*.7,0,Math.PI*2);ctx.fill();ctx.restore()}}
function fitBrand(){let a=subtitle.getBoundingClientRect().width,b=brand.getBoundingClientRect().width;if(b)brand.style.transform=`scaleX(${a/b})`}
function showDoor(){if(doorVisible)return;doorVisible=true;door.classList.add('doorIn');glow.classList.add('doorGlowIn');prompt.classList.add('promptShow');flash.classList.remove('blackFlash');void flash.offsetWidth;flash.classList.add('blackFlash')}
function openDoor(){if(!doorVisible||doorOpened)return;doorOpened=true;prompt.classList.remove('promptShow');door.classList.add('opening');setTimeout(()=>{titleVisible=true;logo.classList.add('logoShow');fitBrand();setTimeout(()=>{document.getElementById('arrow').classList.add('arrowGo');arrowDone=true;setTimeout(()=>hint.classList.add('show'),1050)},1300)},650)}
function next(){if(stopped)return;stopped=true;cancelAnimationFrame(raf);location.href=NEXT_HTML}
skip.addEventListener('pointerup',e=>{e.stopPropagation();next()});door.addEventListener('pointerup',e=>{e.stopPropagation();if(doorOpened)return;let n=performance.now();if(n-lastDoorTap<=380){lastDoorTap=0;openDoor()}else lastDoorTap=n});hint.addEventListener('pointerup',()=>{if(titleVisible&&arrowDone)next()});
function draw(t,dt){sky(t);drawStars(t);sun(t);moon(t);redMoon(t);drawFeathers(t,dt);drawMeteors(t,dt);if(t>=34&&t<35.2){let q=clamp((t-34)/1.2,0,1),r=Math.min(w,h)*(.06+q*.55);ctx.strokeStyle=`rgba(255,245,230,${1-q})`;ctx.lineWidth=5*(1-q)+1;ctx.beginPath();ctx.arc(w*.72,h*.34,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle=`rgba(255,245,230,${Math.max(0,1-q*1.8)})`;ctx.beginPath();ctx.arc(w*.72,h*.34,Math.min(w,h)*.18*(1-q),0,Math.PI*2);ctx.fill()}}
function loop(now){if(stopped)return;let t=(now-start)/1000,dt=Math.min(.05,(now-last)/1000);last=now;draw(t,dt);if(t>=40&&!doorVisible)showDoor();raf=requestAnimationFrame(loop)}
startButton.addEventListener('pointerup',async()=>{startButton.disabled=true;status.textContent='再生準備中…';try{audio.currentTime=0;await audio.play();status.textContent='再生中';popup.remove();start=performance.now();last=start;raf=requestAnimationFrame(loop)}catch(e){status.textContent='音声を再生できませんでした。もう一度押してください。';startButton.disabled=false}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&titleVisible)next()});
})();
</script></body></html>
