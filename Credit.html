<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>RhythmosAE Credits</title>

<style>

* {
  box-sizing:border-box;
}


body {

  margin:0;

  min-height:100vh;

  overflow-y:auto;

  background:#050505;

  color:white;

  font-family:
  "Share Tech Mono",
  monospace;

}



/* メイン */

.credit-container {

  width:80%;

  max-width:900px;

  margin:50px auto;

  padding:40px;

  border:2px solid #dc143c;

  box-shadow:
    0 0 20px #dc143c;

  background:rgba(0,0,0,0.8);

}



/* 音量確認 */

#warning {

  position:fixed;

  inset:0;

  z-index:1000;

  display:flex;

  align-items:center;

  justify-content:center;

  background:rgba(0,0,0,0.75);

  backdrop-filter:blur(4px);

}


.warning-box {

  width:min(420px,85vw);

  padding:30px 26px 26px;

  text-align:center;

  background:rgba(10,10,10,0.97);

  border:2px solid #dc143c;

  border-radius:14px;

  box-shadow:
    0 0 15px #dc143c,
    0 0 35px rgba(220,20,60,0.35);

}


.warning-box p {

  margin:0;

  font-size:20px;

  line-height:1.7;

  text-shadow:0 0 8px rgba(255,255,255,0.35);

}


#startButton {

  display:block;

  margin:24px auto 0;

  padding:11px 50px;

  font-size:20px;

  color:white;

  background:transparent;

  border:2px solid #dc143c;

  border-radius:8px;

  cursor:pointer;

  box-shadow:0 0 10px rgba(220,20,60,0.7);

}


#startButton:hover {

  background:rgba(220,20,60,0.3);

  box-shadow:0 0 18px #dc143c;

}



/* 見出し */

h1 {

  text-align:center;

  font-size:60px;

  letter-spacing:10px;

  text-shadow:

    0 0 15px #dc143c,

    0 0 40px #ffd700;

}



h2 {

  margin-top:50px;

  border-bottom:2px solid #dc143c;

  padding-bottom:10px;

  text-shadow:

    0 0 10px #dc143c;

}



/* 内容 */

.credit-item {

  margin:20px 0;

  line-height:1.8;

}



/* 戻るボタン */

button {

  display:block;

  margin:40px auto;

  padding:15px 60px;

  font-size:25px;

  color:white;

  background:transparent;

  border:2px solid #dc143c;

  border-radius:10px;

  cursor:pointer;

  box-shadow:

    0 0 10px #dc143c;

}



button:hover {

  background:rgba(220,20,60,0.3);

}



</style>

</head>


<body>
<div id="warning">
    <div class="warning-box">
        <p>このページでは音声が流れます</p>
        <button id="startButton">OK</button>
    </div>
</div>

<audio id="credit-bgm" src="credit.mp3" loop></audio>

<div class="credit-container">


<h1>
Credits
</h1>



<h2>
Developer
</h2>

<div class="credit-item">

RhythmosAE<br>

Developed by Nio_games & Rhythmos Studio

</div>




<h2>
Music
</h2>

<div class="credit-item">

自作曲<br>

<br>

楽曲提供:siL4only<br>

<br>

音楽素材:<br>

・甘茶の音楽工房<br>

・魔王魂<br>

・BGMer
<br>

※各楽曲の利用規約に従って使用しています。

</div>




<h2>
Special Thanks
</h2>

<div class="credit-item">

制作者:Rhythmos Studio<br>
使用言語:
HTML<br>
JavaScript<br>
CSS
</div>

<button onclick="back()">

BACK

</button>



</div>



<script>

function back(){

  location.href="title.html";

}
const warning =
document.getElementById("warning");

const button =
document.getElementById("startButton");

const bgm =
document.getElementById("credit-bgm");


button.addEventListener("click",()=>{

    warning.style.display="none";

    bgm.volume = 0.5;

    bgm.play();

});
</script>


</body>

</html>
