<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>RhythmosAE Credits</title>
<style>
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;overflow-y:auto;background:#050505;color:white;font-family:"Share Tech Mono",monospace;position:relative;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(255,255,255,.025) 4px);z-index:20;mix-blend-mode:screen;}
body.glitch{animation:screenShake .12s steps(2) 1;}
.credit-container{width:80%;max-width:900px;margin:50px auto;padding:40px;border:2px solid #dc143c;box-shadow:0 0 20px #dc143c;background:rgba(0,0,0,.8);position:relative;overflow:hidden;transition:transform .08s,filter .08s;}
.credit-container::before,.credit-container::after{content:"";position:absolute;left:-20%;width:140%;height:2px;background:#fff;opacity:0;pointer-events:none;}
.credit-container::before{top:38%;box-shadow:0 0 10px #00eaff;}.credit-container::after{top:71%;box-shadow:0 0 10px #ff004c;}
body.glitch .credit-container::before{animation:glitchLine .16s steps(2) 1;}body.glitch .credit-container::after{animation:glitchLine2 .11s steps(2) 1;}
body.glitch .credit-container{filter:contrast(1.3);}
#warning{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);}
.warning-box{width:min(420px,85vw);padding:30px 26px 26px;text-align:center;background:rgba(10,10,10,.97);border:2px solid #dc143c;border-radius:14px;box-shadow:0 0 15px #dc143c,0 0 35px rgba(220,20,60,.35);}
.warning-box p{margin:0;font-size:20px;line-height:1.7;text-shadow:0 0 8px rgba(255,255,255,.35);}
#startButton{display:block;margin:24px auto 0;padding:11px 50px;font-size:20px;color:white;background:transparent;border:2px solid #dc143c;border-radius:8px;cursor:pointer;box-shadow:0 0 10px rgba(220,20,60,.7);}#startButton:hover{background:rgba(220,20,60,.3);box-shadow:0 0 18px #dc143c;}
h1{text-align:center;font-size:60px;letter-spacing:10px;text-shadow:0 0 15px #dc143c,0 0 40px #ffd700;position:relative;}
h1::before,h1::after{content:"Credits";position:absolute;left:0;right:0;opacity:0;pointer-events:none;}h1::before{color:#00eaff;transform:translate(3px,-1px);}h1::after{color:#ff004c;transform:translate(-3px,1px);}
body.glitch h1::before{opacity:.8;animation:glitchText .18s steps(2) 1;}body.glitch h1::after{opacity:.8;animation:glitchText2 .13s steps(2) 1;}
h2{margin-top:50px;border-bottom:2px solid #dc143c;padding-bottom:10px;text-shadow:0 0 10px #dc143c;}.credit-item{margin:20px 0;line-height:1.8;}
button{display:block;margin:40px auto;padding:15px 60px;font-size:25px;color:white;background:transparent;border:2px solid #dc143c;border-radius:10px;cursor:pointer;box-shadow:0 0 10px #dc143c;}button:hover{background:rgba(220,20,60,.3);}
#corruption{position:fixed;right:18px;bottom:14px;z-index:30;font:14px monospace;color:#dc143c;opacity:0;pointer-events:none;text-shadow:0 0 8px #dc143c;}
body.glitch #corruption{opacity:1;}
@keyframes glitchText{0%{clip-path:inset(20% 0 65% 0);transform:translate(3px,-2px)}50%{clip-path:inset(65% 0 10% 0);transform:translate(-5px,1px)}100%{clip-path:inset(0);transform:translate(0)}}
@keyframes glitchText2{0%{clip-path:inset(55% 0 15% 0);transform:translate(-4px,2px)}100%{clip-path:inset(0);transform:translate(0)}}
@keyframes glitchLine{0%{opacity:0;transform:translateX(-20%)}40%{opacity:1;transform:translateX(12%)}100%{opacity:0;transform:translateX(80%)}}
@keyframes glitchLine2{0%{opacity:0;transform:translateX(70%)}35%{opacity:1;transform:translateX(-8%)}100%{opacity:0;transform:translateX(-80%)}}
@keyframes screenShake{0%,100%{transform:translate(0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
</style>
</head>
<body>
<div id="warning"><div class="warning-box"><p>このページでは音声が流れます</p><button id="startButton">OK</button></div></div>
<audio id="credit-bgm" src="credit.mp3" loop></audio>
<div class="credit-container">
<h1>Credits</h1>
<h2>Developer</h2><div class="credit-item" id="developerText">RhythmosAE<br>Developed by Nio_games & Rhythmos Studio</div>
<h2>Music</h2><div class="credit-item">自作曲<br><br>楽曲提供:siL4only<br><br>音楽素材:<br>・甘茶の音楽工房<br>・魔王魂<br>・BGMer<br>・MusMus<br>※各楽曲の利用規約に従って使用しています。<br>BGM：H/MIX GALLERY https://www.hmix.net</div>
<a href="https://www.hmix.net">H/MIX GALLERY</a>
<h2>Special Thanks</h2><div class="credit-item">制作者:Rhythmos Studio<br>使用言語:<br>HTML<br>JavaScript<br>CSS</div>
<button id="backButton" onclick="back()">BACK</button>
</div>
<div id="corruption"></div>
<script>
function back(){location.href="title.html";}
const warning=document.getElementById("warning"),button=document.getElementById("startButton"),bgm=document.getElementById("credit-bgm"),developerText=document.getElementById("developerText"),backButton=document.getElementById("backButton"),corruption=document.getElementById("corruption");
button.addEventListener("click",()=>{warning.style.display="none";bgm.volume=.5;bgm.play();startGlitches();});
const messages=["SYSTEM WARNING","ERROR 404","NaN","undefined","NULL","WHY","CREDITS.exe","Developer not found","RhythmosAE has stopped responding."];
const devNormal="RhythmosAE<br>Developed by Nio_games & Rhythmos Studio";
function startGlitches(){
  function glitch(){
    document.body.classList.add("glitch");
    const msg=messages[Math.floor(Math.random()*messages.length)];
    corruption.textContent=msg+" // 0x"+Math.floor(Math.random()*0xffff).toString(16).toUpperCase();
    if(Math.random()<.35){
      developerText.innerHTML=Math.random()<.5?"Rhythmos Studio has stopped responding.<br>Attempting recovery...":"RhythmosAEEAEAE<br>Developed by Nio_games & Rhythmos Studio";
      backButton.textContent=Math.random()<.5?"BACK???":"B̷A̶C̷K";
    }
    setTimeout(()=>{developerText.innerHTML=devNormal;backButton.textContent="BACK";document.body.classList.remove("glitch");},180+Math.random()*220);
    setTimeout(glitch,4500+Math.random()*8500);
  }
  setTimeout(glitch,1800+Math.random()*3000);
}
</script>
</body>
</html>
